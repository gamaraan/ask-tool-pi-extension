name: test

# Runs the unit test suite on every pull request against main. The tests are
# maintained in this repository and run against a temporary pi-mono checkout
# because they reuse pi-mono's vitest alias graph and node_modules.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ask-tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ask-tool
          persist-credentials: false

      # pi-mono is a read-only temporary test host: the ask-tool tsconfig paths
      # and vitest alias graph resolve into it.
      - name: Checkout pi-mono (temporary test host)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: earendil-works/pi-mono
          path: pi-mono
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ auto-caches npm by default; disable it (see
          # zizmor cache-poisoning audit) - the verify job must be hermetic.
          package-manager-cache: false

      - name: Install pi-mono dependencies
        run: npm ci --ignore-scripts
        working-directory: pi-mono

      - name: Generate pi-mono provider model data
        # packages/ai/src/providers/data/*.json is gitignored build output
        # imported by the provider *.models.ts sources (needed by both the
        # typecheck and the test run); regenerated from embedded constants.
        run: npm --prefix packages/ai run generate-models
        working-directory: pi-mono

      - name: Typecheck
        run: npm run typecheck
        working-directory: ask-tool

      - name: Run unit tests
        run: npm test
        working-directory: ask-tool

      - name: Verify package contents
        run: npm run verify:package
        working-directory: ask-tool
